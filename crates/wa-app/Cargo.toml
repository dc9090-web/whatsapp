[package]
name = "wa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "whatsapp-cosmic"
path = "src/main.rs"

[features]
# Desktop integration (notifications, autostart) via `wa-desktop`.
default = ["desktop"]
desktop = []

[dependencies]
wa-core.workspace = true
wa-desktop.workspace = true
anyhow.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
libcosmic.workspace = true
# Must match the version cosmic-text uses (its `Fallback` trait takes `Script`).
unicode-script = "0.5.8"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# GIPHY search (the same HTTP client whatsapp-rust already uses).
ureq = "3"
# Emoji names and shortcodes for the picker's search.
emojis = "0.9"
serde_json.workspace = true
# Decoders are for custom notification sounds; voice notes use libopus.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "vorbis", "flac"] }
ogg = "0.9"
# Microphone capture for voice messages (same version wa-core uses for calls).
cpal = "0.18"
opus = "0.4"
open = "5"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
