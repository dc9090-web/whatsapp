[package]
name = "wa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
whatsapp-rust.workspace = true
# SQLCipher build: both databases are encrypted at rest (see `dbkey`). The
# protocol library links the same libsqlite3-sys, so it gets SQLCipher too.
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }
# Keying the protocol library's pooled connections goes through diesel.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
getrandom = "0.3"
hex = "0.4"
# Microphone and speaker for voice calls.
cpal = "0.18"
dirs = "6"
oo7 = "0.6"

[dev-dependencies]
tempfile = "3"
qrcode = { version = "0.14", default-features = false }
